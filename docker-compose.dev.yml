# Local development database only: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: showtime
      POSTGRES_PASSWORD: showtime
      POSTGRES_DB: showtime
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - showtime-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showtime"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  showtime-dev-db:
