# Local development database only: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: starring
      POSTGRES_PASSWORD: starring
      POSTGRES_DB: starring
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - starring-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starring"]
      interval: 2s
      timeout: 3s
      retries: 20
  # Catches outgoing email in development: SMTP on 1025, inbox UI on http://localhost:8025
  #   SMTP_URL=smtp://127.0.0.1:1025
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  starring-dev-db:
