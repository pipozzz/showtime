name: Docker image

# Builds the server-mode image and publishes it to GHCR:
#   ghcr.io/pipozzz/starring:latest      — every push to main
#   ghcr.io/pipozzz/starring:sha-<short> — every push to main (pin this for rollbacks)
#   ghcr.io/pipozzz/starring:<version>   — tags like v1.2.3
# Optional: set the repo secret DOKPLOY_DEPLOY_WEBHOOK to the compose service's
# deploy webhook URL, and Dokploy redeploys as soon as the new image is pushed.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Starring
            org.opencontainers.image.description=Your developer career as a scroll story — server mode with accounts and Postgres.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: STARRING_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Dokploy redeploy
        if: github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "No DOKPLOY_DEPLOY_WEBHOOK secret — skipping."; exit 0; fi
          curl -fsS -X POST "$HOOK" -H 'Content-Type: application/json' -d '{}' && echo "Redeploy triggered."
