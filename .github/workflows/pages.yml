name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild weekly so imported numbers stay fresh once importers run in CI.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # optional analytics: set the repo variable PLAUSIBLE_SRC (Settings → Secrets and variables → Actions → Variables)
          PLAUSIBLE_SRC: ${{ vars.PLAUSIBLE_SRC }}
          # shown on /terms and /privacy — set as repo variables
          OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          OPERATOR_EMAIL: ${{ vars.OPERATOR_EMAIL }}
          OPERATOR_ADDRESS: ${{ vars.OPERATOR_ADDRESS }}
          OPERATOR_COUNTRY: ${{ vars.OPERATOR_COUNTRY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
