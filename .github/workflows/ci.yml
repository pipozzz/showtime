name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Same build under a project-pages base path, to catch hard-coded "/" links.
      - run: npm run build
        env:
          BASE_PATH: /showtime
      # Server mode (accounts + Postgres) must build too; no DB needed to build.
      - run: npm run build:server
